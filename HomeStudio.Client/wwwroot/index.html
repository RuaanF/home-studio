<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HomeStudio.Client</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link href="HomeStudio.Client.styles.css" rel="stylesheet" />
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { getAuth, signInWithPopup, GoogleAuthProvider, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    const firebaseConfig = {
        apiKey: "AIzaSyCk_z8ZqBTvI9Ou8X1lv2sjg9zRGb7WIDE",
        authDomain: "homestudio-9116e.firebaseapp.com",
        projectId: "homestudio-9116e",
        storageBucket: "homestudio-9116e.firebasestorage.app",
        messagingSenderId: "541621206456",
        appId: "1:541621206456:web:5337ae70bbcfc7f74b634d"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    window.firebaseSignIn = async function () {
        const result = await signInWithPopup(auth, provider);
        return await result.user.getIdToken();
    };

    window.firebaseSignOut = async function () {
        await signOut(auth);
    };
        </script>

    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
